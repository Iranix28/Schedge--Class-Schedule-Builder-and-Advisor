<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Advisor Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-screen">
    <div id="root" class="h-full"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load your components -->
    <script type="text/babel" src="./login.js"></script>
    <script type="text/babel" src="./PlanSelection.js"></script>
    <script type="text/babel" src="./MultiSemesterUI.js"></script>
    <script type="text/babel" src="./ChatUI.js"></script>

    <!-- Main App component -->
    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [isAuthenticated, setIsAuthenticated] = useState(false);
        const [userData, setUserData] = useState(null);
        const [selectedPlan, setSelectedPlan] = useState(null);
        const [selectedSemester, setSelectedSemester] = useState(null);

        // Initialize and handle browser back/forward
        useEffect(() => {
          const savedUser = localStorage.getItem('rememberedUser');
          if (savedUser) {
            const user = JSON.parse(savedUser);
            setUserData(user);
            setIsAuthenticated(true);
          }

          // Listen for browser back/forward button
          const handlePopState = (event) => {
            if (event.state) {
              setSelectedPlan(event.state.selectedPlan || null);
              setSelectedSemester(event.state.selectedSemester || null);
            } else {
              setSelectedPlan(null);
              setSelectedSemester(null);
            }
          };

          window.addEventListener('popstate', handlePopState);
          
          // Set initial state
          window.history.replaceState({ selectedPlan: null, selectedSemester: null }, '', '/');

          return () => window.removeEventListener('popstate', handlePopState);
        }, []);

        const handleLoginSuccess = (username, rememberMe) => {
          const user = { username };
          setUserData(user);
          setIsAuthenticated(true);
          
          if (rememberMe) {
            localStorage.setItem('rememberedUser', JSON.stringify(user));
          }
        };

        const handleLogout = () => {
          setIsAuthenticated(false);
          setUserData(null);
          setSelectedPlan(null);
          setSelectedSemester(null);
          localStorage.removeItem('rememberedUser');
          window.history.pushState({ selectedPlan: null, selectedSemester: null }, '', '/');
        };

        const handleSelectPlan = (planType) => {
          setSelectedPlan(planType);
          window.history.pushState({ selectedPlan: planType, selectedSemester: null }, '', `#${planType}`);
        };

        const handleSelectSemester = (semester) => {
          setSelectedSemester(semester);
          // Store only the semester ID, not the whole object
          window.history.pushState(
            { selectedPlan: 'multi', semesterId: semester.id, semesterName: semester.name },
            '', 
            `#multi-semester-${semester.id}`
          );
        };

        const handleBackToPlanSelection = () => {
          window.history.back();
        };

        const handleBackToMultiSemester = () => {
          window.history.back();
        };

        return (
          <div className="h-full">
            {!isAuthenticated ? (
              <LoginPage onLoginSuccess={handleLoginSuccess} />
            ) : !selectedPlan ? (
              <PlanSelection 
                onSelectPlan={handleSelectPlan} 
                userData={userData} 
                onLogout={handleLogout} 
              />
            ) : selectedPlan === 'single' ? (
              <ChatUI 
                userData={userData} 
                onLogout={handleLogout}
                onBack={handleBackToPlanSelection}
              />
            ) : selectedPlan === 'multi' && !selectedSemester ? (
              <MultiSemesterUI 
                userData={userData} 
                onLogout={handleLogout}
                onSelectSemester={handleSelectSemester}
                onBack={handleBackToPlanSelection}
              />
            ) : (
              <ChatUI 
                userData={userData} 
                onLogout={handleLogout}
                semester={selectedSemester}
                onBack={handleBackToMultiSemester}
              />
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
