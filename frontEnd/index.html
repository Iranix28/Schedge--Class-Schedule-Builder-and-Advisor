<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Advisor Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-screen">
    <div id="root" class="h-full"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <!-- Load your components -->
    <script type="text/babel" src="./Sidebar.js"></script>
    <script type="text/babel" src="./login.js"></script>
    <script type="text/babel" src="./PlanSelection.js"></script>
    <script type="text/babel" src="./SavedPlansUI.js"></script>
    <script type="text/babel" src="./MultiSemesterUI.js"></script>
    <script type="text/babel" src="./ChatUI.js"></script>

    <!-- Main App component -->
    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [isAuthenticated, setIsAuthenticated] = useState(false);
        const [userData, setUserData] = useState(null);
        const [selectedPlan, setSelectedPlan] = useState(null);
        const [selectedSemester, setSelectedSemester] = useState(null);
        const [selectedSavedPlan, setSelectedSavedPlan] = useState(null);
        const [sidebarRefreshKey, setSidebarRefreshKey] = useState(0);
        const [resetKey, setResetKey] = useState(0);

        const handlePlanSaved = () => {
          setSidebarRefreshKey((k) => k + 1);
        };

        // Initialize and handle browser back/forward
        useEffect(() => {
          (async () => {
            try {
              const res = await fetch("http://localhost:8000/auth/me", {
                credentials: "include",
              });
              if (!res.ok) return;

              const user = await res.json();
              setUserData(user);
              setIsAuthenticated(true);
            } catch (e) {}
          })();
        }, []);

        const handleLoginSuccess = (user) => {
          setUserData(user);
          setIsAuthenticated(true);
        };

        const handleLogout = async () => {
          try {
            await fetch("http://localhost:8000/auth/logout", {
              method: "POST",
              credentials: "include",
            });
          } catch (e) {}

          setIsAuthenticated(false);
          setUserData(null);
        };

        const handleSelectPlanType = (planType) => {
          setSelectedPlan(planType);
        };

        const handleBackToPlanSelection = () => {
          setSelectedPlan(null);
          setSelectedSemester(null);
          setSelectedSavedPlan(null);
        };

        const handleSelectSavedPlan = (plan) => {
          setSelectedSavedPlan(plan);
          if (plan.mode === "multi") {
            setSelectedPlan("saved-multi");
          } else {
            setSelectedPlan('saved');
          }
        };

        const handleBackToSavedPlans = () => {
          setSelectedSavedPlan(null);
        };

        const handleSelectSemester = (semester) => {
          console.log("[handleSelectSemester] semester received:", JSON.stringify(semester));
          setSelectedSemester(semester);
        };

        const handleBackToMultiSemester = (updatedSemesterData) => {
          // Patch the updated messages + schedule back into selectedSavedPlan
          // so MultiSemesterUI re-renders with fresh data without needing a full reload
          if (updatedSemesterData && selectedSemester?.semester_db_id) {
            setSelectedSavedPlan((prev) => {
              if (!prev) return prev;
              return {
                ...prev,
                semesters: prev.semesters.map((sem) =>
                  sem.id === selectedSemester.semester_db_id
                    ? { ...sem, messages: updatedSemesterData.messages, schedule: updatedSemesterData.schedule }
                    : sem
                ),
              };
            });
          }
          setSelectedSemester(null);
        };

        const handleSidebarNavigate = (mode) => {
          setSelectedSavedPlan(null);
          setSelectedSemester(null);
          setSelectedPlan(mode);
          setResetKey((k) => k + 1); // force fresh remount of target UI
        };

        const handleSidebarNewChat = () => {
          setSelectedSavedPlan(null);
          setSelectedSemester(null);
          setSelectedPlan('single');
        };

        const handleSidebarSelectPlan = (plan) => {
          setSelectedSavedPlan(plan);
          if (plan.mode === "multi") {
            setSelectedPlan("saved-multi");
          } else {
            setSelectedPlan('saved');
          }
        };

        return (
          <div className="h-full">
            {/* Sidebar – always visible on authenticated views */}
            {isAuthenticated && (
              <Sidebar
                userData={userData}
                onNewChat={handleSidebarNewChat}
                onSelectSavedPlan={handleSidebarSelectPlan}
                onNavigate={handleSidebarNavigate}
                refreshKey={sidebarRefreshKey}
              />
            )}

            {/* Main content area – always offset by sidebar width */}
            <div
              style={{
                marginLeft: isAuthenticated ? "260px" : "0px",
                height: "100%",
              }}
            >
              {!isAuthenticated ? (
                <LoginPage onLoginSuccess={handleLoginSuccess} />
              ) : !selectedPlan ? (
                <PlanSelection 
                  onSelectPlan={handleSelectPlanType} 
                  userData={userData} 
                  onLogout={handleLogout} 
                />
              ) : selectedPlan === 'saved' && !selectedSavedPlan ? (
                <SavedPlansUI
                  userData={userData}
                  onLogout={handleLogout}
                  onBack={handleBackToPlanSelection}
                  onSelectPlan={handleSelectSavedPlan}
                  onPlanDeleted={handlePlanSaved}
                />
              ) : selectedPlan === 'saved-multi' && selectedSavedPlan && !selectedSemester ? (
                <MultiSemesterUI
                  userData={userData}
                  onLogout={handleLogout}
                  onSelectSemester={handleSelectSemester}
                  savedPlan={selectedSavedPlan}
                  onBack={handleBackToPlanSelection}
                  onPlanSaved={handlePlanSaved}
                />
              ) : selectedPlan === 'saved-multi' && selectedSemester ? (
                <ChatUI
                  userData={userData}
                  onLogout={handleLogout}
                  semester={selectedSemester}
                  onBack={handleBackToMultiSemester}
                  onPlanSaved={handlePlanSaved}
                />
              ) : selectedPlan === 'saved' && selectedSavedPlan ? (
                <ChatUI 
                  userData={userData} 
                  onLogout={handleLogout}
                  onBack={handleBackToSavedPlans}
                  savedPlan={selectedSavedPlan}
                  onPlanSaved={handlePlanSaved}
                />
              ) : selectedPlan === 'single' ? (
                <ChatUI 
                  key={resetKey}
                  userData={userData} 
                  onLogout={handleLogout}
                  onBack={handleBackToPlanSelection}
                  onPlanSaved={handlePlanSaved}
                />
              ) : selectedPlan === 'multi' && !selectedSemester ? (
                <MultiSemesterUI 
                  key={resetKey}
                  userData={userData} 
                  onLogout={handleLogout}
                  onSelectSemester={handleSelectSemester}
                  onBack={handleBackToPlanSelection}
                  onPlanSaved={handlePlanSaved}
                />
              ) : (
                <ChatUI 
                  userData={userData} 
                  onLogout={handleLogout}
                  semester={selectedSemester}
                  onBack={handleBackToMultiSemester}
                  onPlanSaved={handlePlanSaved}
                />
              )}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
