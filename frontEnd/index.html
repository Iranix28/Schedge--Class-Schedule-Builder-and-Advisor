<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chat UI</title>
    <!-- Tailwind (optional; you used Tailwind classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="h-screen">
    <div id="root" class="h-full"></div>

    <!-- React + ReactDOM UMD (global React/ReactDOM objects) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel so the browser can understand JSX (dev only) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Your component file as JSX -->
    <script type="text/babel" src="./ChatUI.js"></script>

    <!-- Render it -->
    <script type="text/babel">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ChatUI />);
    </script>
  </body>
</html>
